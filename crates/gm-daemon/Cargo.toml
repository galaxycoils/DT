[package]
name = "gm-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gm_daemon"
path = "src/lib.rs"

[[bin]]
name = "gm-daemon"
path = "src/main.rs"

[[bin]]
name = "dt"
path = "src/bin/dt.rs"

[[bin]]
name = "gm"
path = "src/bin/gm.rs"

[[bin]]
name = "dt-doctor"
path = "src/bin/dt_doctor.rs"

[dependencies]
flate2 = "1"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
rusqlite = { workspace = true }
gm-core = { workspace = true, features = ["sqlite"] }
gm-platform = { workspace = true }
gm-llm = { workspace = true, features = ["local-vlm"] }
gm-vlm-candle = { workspace = true }
gm-safety = { workspace = true }
gm-memory = { workspace = true }
gm-goals = { workspace = true }
gm-agent = { workspace = true }
gm-openbot = { workspace = true }
gm-muse = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
libc = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "macos")'.dependencies]
gm-vlm-candle = { workspace = true, features = ["metal"] }

tempfile = { workspace = true }

[dev-dependencies]
gm-cu-helper = { workspace = true }

