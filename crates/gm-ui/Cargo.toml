[package]
name = "gm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gm-ui"
path = "src/main.rs"

[features]
default = []
hardware-wgpu = ["eframe/wgpu", "dep:wgpu"]

[dependencies]
base64 = "0.22"
chrono = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
gm-llm = { workspace = true }
zeroize = "1"
uuid = { workspace = true }
# Opt-in hardware WGPU backend; default renderer is ultra-lightweight glow.
wgpu = { version = "27", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
gm-core = { workspace = true }
gm-platform = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gm-daemon = { workspace = true }
gm-muse = { workspace = true }
libc = { workspace = true }

[build-dependencies]
cc = "1.2"

