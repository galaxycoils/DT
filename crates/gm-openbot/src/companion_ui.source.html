<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grok Muse</title><link rel="stylesheet" href="/companion.css"><script src="/companion.js" defer></script></head>
<body><nav id="rail" aria-label="Workspace"></nav><aside id="sidebar" aria-label="Bots and groups"></aside><main id="main"><header id="header"></header><p id="notice" role="status" aria-live="polite"></p><section id="workspace"></section><form id="composer"><div id="chips"></div><div id="suggestions" role="listbox" hidden></div><textarea id="draft" aria-label="Message" placeholder="Message your bot, /skill, or @mention" rows="2"></textarea><div class="row"><button id="attach" type="button" aria-label="Attach file">＋</button><button id="mode" type="button">Chat</button><button id="dictate" type="button">Dictate</button><button id="send" class="accent" type="submit">Start Voice Chat</button></div><input id="file" type="file" hidden multiple></form></main><aside id="details" hidden></aside><section id="split" hidden><header id="split-head"></header><iframe id="space-iframe" title="Isolated Static Space" sandbox="allow-scripts"></iframe><div id="page"></div></section><div id="overlay" hidden></div><input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></body></html>
