[package]
name = "gm-openbot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenBot multi-agent coworker orchestration, durable FIFO queues, channels, A2A, AG-UI companion server, and external chat bridges"

[dependencies]
chrono-tz = { workspace = true }
gm-core = { workspace = true, features = ["sqlite"] }
gm-safety = { workspace = true }
gm-memory = { workspace = true }
gm-llm = { workspace = true }
gm-muse = { workspace = true }
gm-goals = { workspace = true }
gm-platform = { workspace = true }
gm-agent = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = { workspace = true }
sha1 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
hex = { workspace = true }
hmac = { workspace = true }
regex = { workspace = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

libc = { workspace = true }

tempfile = { workspace = true }
