name: CI

on:
  push:
    branches: [ "master", "main", "codex/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout DT
        uses: actions/checkout@v4
        with:
          path: grok-muse

      - name: Checkout Darius
        uses: actions/checkout@v4
        with:
          repository: galaxycoils/darius
          ref: f47a4ce980abecb751c9f5c79e1c424a20100433
          path: Darius

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpipewire-0.3-dev libspa-0.2-dev clang xvfb gcc-mingw-w64-x86-64 dpkg-dev

      - name: Check formatting
        working-directory: grok-muse
        run: cargo fmt --all -- --check

      - name: Install Node for companion, web, and mobile verification
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify generated UI tokens, companion bundle, React web, and Expo mobile
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          python3 tools/generate-ui-tokens.py
          npm ci --prefix tools/companion
          npm run build --prefix tools/companion
          git diff --exit-code -- crates/gm-openbot/src/companion_ui.js crates/gm-openbot/src/companion_ui.html crates/gm-openbot/src/companion_ui.css crates/gm-openbot/src/companion_tokens.css crates/gm-ui/src/ui/tokens.rs clients/web/src/tokens.css clients/mobile/lib/tokens.ts
          npm test --prefix tools/companion
          node --test tools/tests/companion-events.test.cjs
          npm ci --prefix clients/web
          npm run typecheck --prefix clients/web
          npm run build --prefix clients/web
          npm test --prefix clients/web
          npm ci --prefix clients/mobile
          npm run typecheck --prefix clients/mobile
          npm test --prefix clients/mobile

      - name: Verify release tools, coverage inventory, and budget ledger (Linux)
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          python3 tools/test_release_tools.py
          cargo run --locked -p xtask -- budget-ledger
          cargo run --locked -p xtask -- certify all --allow-incomplete --json

      - name: Clippy check (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Clippy check (Linux and Windows)
        if: runner.os != 'macOS'
        working-directory: grok-muse
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Windows target platform foundations
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --locked --target x86_64-pc-windows-gnu -p gm-platform -p gm-core -p gm-cu-helper -p gm-muse -p gm-daemon

      - name: Run nextest (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo nextest run --locked --workspace --all-features

      - name: Run nextest (Linux and Windows)
        if: runner.os != 'macOS'
        working-directory: grok-muse
        run: cargo nextest run --locked --workspace

      - name: Verify workspace guest protocol
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: python3 tools/workspace-guest/test_agent.py

      - name: Verify real X11 capture and input
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: tools/test-native-x11.sh

      - name: Verify companion in a real browser with isolated daemon storage
        if: runner.os == 'Linux'
        working-directory: grok-muse
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          cargo build --locked -p gm-daemon --bin gm-daemon
          npm run smoke --prefix tools/companion

      - name: Run G5 eval suite gate
        working-directory: grok-muse
        run: cargo run --locked -p xtask -- eval

      - name: Benchmark G4 LLM latency gate
        working-directory: grok-muse
        run: cargo run --locked -p xtask -- bench-llm

      - name: Verify Ubuntu .deb installer pipeline (Linux only)
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          cargo build --release --locked -p gm-daemon -p gm-cu-helper -p gm-ui --bins
          mkdir -p target/dist
          bash tools/installers/linux/build-deb.sh 1.0.0 target/release target/dist/dt_1.0.0_amd64.deb
          dpkg-deb -I target/dist/dt_1.0.0_amd64.deb
          python3 -c '
          import hashlib, json, pathlib, runpy, subprocess
          m = runpy.run_path("tools/package-release.py")
          out = pathlib.Path("target/dist")
          name = "dt_1.0.0_amd64.deb"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          digest = hashlib.sha256((out / name).read_bytes()).hexdigest()
          (out / f"{name}.sha256").write_text(f"{digest}  {name}\n")
          (out / f"{name}.build.json").write_text(json.dumps(dict(product="DT", commit=commit, version="1.0.0", os="linux", architecture="x86_64", sha256=digest), sort_keys=True) + "\n")
          m["write_sbom"](out, name, "1.0.0", commit, "linux", "x86_64")
          '

      - name: Upload Ubuntu .deb installer artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x86_64
          path: grok-muse/target/dist/dt_1.0.0_amd64.deb*

      - name: Verify Windows NSIS installer pipeline (Windows only)
        if: runner.os == 'Windows'
        working-directory: grok-muse
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [[ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]] && [[ ! -f "/c/Program Files/NSIS/makensis.exe" ]]; then
            choco install nsis -y --no-progress
          fi
          cargo build --release --locked -p gm-daemon -p gm-cu-helper -p gm-ui --bins
          python3 -c '
          import hashlib, json, pathlib, runpy, shutil, subprocess
          m = runpy.run_path("tools/package-release.py")
          root = pathlib.Path(".").resolve()
          bin_dir = (root / "target" / "release").resolve()
          out = (root / "target" / "dist").resolve()
          out.mkdir(parents=True, exist_ok=True)
          name = "DT-1.0.0-windows-x86_64-setup.exe"
          exe = out / name
          candidates = [
              shutil.which("makensis"),
              shutil.which("makensis.exe"),
              "C:/Program Files (x86)/NSIS/makensis.exe",
              "C:/Program Files/NSIS/makensis.exe",
              "C:/ProgramData/chocolatey/bin/makensis.exe",
          ]
          makensis = next(c for c in candidates if c and pathlib.Path(c).exists())
          subprocess.run([
              makensis,
              "/DVERSION=1.0.0",
              f"/DBIN_DIR={bin_dir}",
              f"/DSRC_ROOT={root}",
              f"/DOUT_FILE={exe}",
              str(root / "tools/installers/windows/dt-installer.nsi"),
          ], check=True)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          (out / f"{name}.sha256").write_text(f"{digest}  {name}\n")
          (out / f"{name}.build.json").write_text(json.dumps(dict(product="DT", commit=commit, version="1.0.0", os="windows", architecture="x86_64", sha256=digest), sort_keys=True) + "\n")
          m["write_sbom"](out, name, "1.0.0", commit, "windows", "x86_64")
          '

      - name: Upload Windows NSIS installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x86_64
          path: grok-muse/target/dist/DT-1.0.0-windows-x86_64-setup.exe*

      - name: Verify release DMG pipeline (macOS only)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          for ARCH in aarch64 x86_64; do
            rustup target add "${ARCH}-apple-darwin"
            DMG="target/dist/DT-${VERSION}-macos-${ARCH}.dmg"
            cargo run --locked -p xtask -- dmg --release --target "${ARCH}-apple-darwin" --identity - --output "$DMG"
            cargo run --locked -p xtask -- verify-dmg --dmg-path "$DMG"
            (cd target/dist && shasum -a 256 -c "$(basename "$DMG").sha256")
          done

      - name: Upload macOS DMG installer artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: grok-muse/target/dist/DT-*-macos-*.dmg*
          if-no-files-found: error
