name: CI

on:
  push:
    branches: [ "master", "main", "codex/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout DT
        uses: actions/checkout@v4
        with:
          path: grok-muse

      - name: Checkout Darius
        uses: actions/checkout@v4
        with:
          repository: galaxycoils/darius
          ref: f47a4ce980abecb751c9f5c79e1c424a20100433
          path: Darius

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          PKGS="pkg-config libssl-dev libsqlite3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpipewire-0.3-dev libspa-0.2-dev clang xvfb dpkg-dev"
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then
            PKGS="$PKGS gcc-mingw-w64-x86-64"
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y $PKGS

      - name: Enable ARMv8.2 FP16 target feature for gemm-f16 on Linux ARM64
        if: matrix.os == 'ubuntu-24.04-arm'
        run: echo "RUSTFLAGS=-C target-feature=+fp16" >> "$GITHUB_ENV"

      - name: Check formatting
        working-directory: grok-muse
        run: cargo fmt --all -- --check

      - name: Install Node for companion, web, and mobile verification
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify generated UI tokens, companion bundle, React web, and Expo mobile
        if: matrix.os == 'ubuntu-24.04'
        working-directory: grok-muse
        run: |
          python3 tools/generate-ui-tokens.py
          npm ci --prefix tools/companion
          npm run build --prefix tools/companion
          git diff --exit-code -- crates/gm-openbot/src/companion_ui.js crates/gm-openbot/src/companion_ui.html crates/gm-openbot/src/companion_ui.css crates/gm-openbot/src/companion_tokens.css crates/gm-ui/src/ui/tokens.rs clients/web/src/tokens.css clients/mobile/lib/tokens.ts
          npm test --prefix tools/companion
          node --test tools/tests/companion-events.test.cjs
          npm ci --prefix clients/web
          npm run typecheck --prefix clients/web
          npm run build --prefix clients/web
          npm test --prefix clients/web
          npm ci --prefix clients/mobile
          npm run typecheck --prefix clients/mobile
          npm test --prefix clients/mobile

      - name: Verify release tools, coverage inventory, and budget ledger (Linux)
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          python3 tools/test_release_tools.py
          cargo run --locked -p xtask -- budget-ledger
          cargo run --locked -p xtask -- certify all --allow-incomplete --json

      - name: Clippy check (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Clippy check (Linux and Windows)
        if: runner.os != 'macOS'
        working-directory: grok-muse
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Windows target platform foundations
        if: matrix.os == 'ubuntu-24.04'
        working-directory: grok-muse
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --locked --target x86_64-pc-windows-gnu -p gm-platform -p gm-core -p gm-cu-helper -p gm-muse -p gm-daemon

      - name: Run nextest (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo nextest run --locked --workspace --all-features

      - name: Run nextest (Linux and Windows)
        if: runner.os != 'macOS'
        working-directory: grok-muse
        run: cargo nextest run --locked --workspace

      - name: Verify workspace guest protocol
        if: matrix.os == 'ubuntu-24.04'
        working-directory: grok-muse
        run: python3 tools/workspace-guest/test_agent.py

      - name: Verify real X11 capture and input
        if: matrix.os == 'ubuntu-24.04'
        working-directory: grok-muse
        run: tools/test-native-x11.sh

      - name: Verify companion in a real browser with isolated daemon storage
        if: matrix.os == 'ubuntu-24.04'
        working-directory: grok-muse
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          cargo build --locked -p gm-daemon --bin gm-daemon
          npm run smoke --prefix tools/companion

      - name: Run G5 eval suite gate
        working-directory: grok-muse
        run: cargo run --locked -p xtask -- eval

      - name: Benchmark G4 LLM latency gate
        working-directory: grok-muse
        run: cargo run --locked -p xtask -- bench-llm

      - name: Verify Ubuntu .deb installer pipeline (Linux only)
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          export VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          export ARCH=$(python3 -c 'import runpy; print(runpy.run_path("tools/package-release.py")["native_target"]()[1])')
          export DEB_NAME=$(python3 -c "import os, runpy; print(runpy.run_path('tools/package-release.py')['archive_name'](os.environ['VERSION'], 'linux', os.environ['ARCH']))")
          cargo build --release --locked -p gm-daemon -p gm-cu-helper -p gm-ui --bins
          mkdir -p target/dist
          bash tools/installers/linux/build-deb.sh "$VERSION" target/release "target/dist/$DEB_NAME" "$ARCH"
          dpkg-deb -I "target/dist/$DEB_NAME"
          python3 -c '
          import hashlib, json, os, pathlib, runpy, subprocess
          m = runpy.run_path("tools/package-release.py")
          out = pathlib.Path("target/dist")
          version = os.environ["VERSION"]
          arch = os.environ["ARCH"]
          name = os.environ["DEB_NAME"]
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          digest = hashlib.sha256((out / name).read_bytes()).hexdigest()
          (out / f"{name}.sha256").write_text(f"{digest}  {name}\n")
          (out / f"{name}.build.json").write_text(json.dumps(dict(product="DT", commit=commit, version=version, os="linux", architecture=arch, sha256=digest), sort_keys=True) + "\n")
          m["write_sbom"](out, name, version, commit, "linux", arch)
          '

      - name: Upload Ubuntu .deb installer artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: grok-muse/target/dist/dt_*.deb*

      - name: Verify Windows NSIS installer pipeline (Windows x64 & ARM64)
        if: runner.os == 'Windows'
        working-directory: grok-muse
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [[ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]] && [[ ! -f "/c/Program Files/NSIS/makensis.exe" ]]; then
            choco install nsis -y --no-progress
          fi
          rustup target add aarch64-pc-windows-msvc
          cargo build --release --locked -p gm-daemon -p gm-cu-helper -p gm-ui --bins
          cargo build --release --locked --target aarch64-pc-windows-msvc -p gm-daemon -p gm-cu-helper -p gm-ui --bins
          python3 -c '
          import hashlib, json, pathlib, runpy, shutil, subprocess, tomllib
          m = runpy.run_path("tools/package-release.py")
          root = pathlib.Path(".").resolve()
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          out = (root / "target" / "dist").resolve()
          out.mkdir(parents=True, exist_ok=True)
          candidates = [
              shutil.which("makensis"),
              shutil.which("makensis.exe"),
              "C:/Program Files (x86)/NSIS/makensis.exe",
              "C:/Program Files/NSIS/makensis.exe",
              "C:/ProgramData/chocolatey/bin/makensis.exe",
          ]
          makensis = next(c for c in candidates if c and pathlib.Path(c).exists())
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          for arch, bin_dir in [
              ("x86_64", (root / "target" / "release").resolve()),
              ("aarch64", (root / "target" / "aarch64-pc-windows-msvc" / "release").resolve()),
          ]:
              name = m["archive_name"](version, "windows", arch)
              exe = out / name
              for b in m["BINARIES"]:
                  m["verify_binary_architecture"](bin_dir / f"{b}.exe", "windows", arch)
              subprocess.run([
                  makensis,
                  f"/DVERSION={version}",
                  f"/DBIN_DIR={bin_dir}",
                  f"/DSRC_ROOT={root}",
                  f"/DOUT_FILE={exe}",
                  str(root / "tools/installers/windows/dt-installer.nsi"),
              ], check=True)
              digest = hashlib.sha256(exe.read_bytes()).hexdigest()
              (out / f"{name}.sha256").write_text(f"{digest}  {name}\n")
              (out / f"{name}.build.json").write_text(json.dumps(dict(product="DT", commit=commit, version=version, os="windows", architecture=arch, sha256=digest), sort_keys=True) + "\n")
              m["write_sbom"](out, name, version, commit, "windows", arch)
          '

      - name: Upload Windows NSIS installer artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: grok-muse/target/dist/DT-*-windows-*-setup.exe*

      - name: Verify release DMG pipeline (macOS only)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        shell: bash
        run: |
          export VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          export COMMIT=$(git rev-parse HEAD)
          for ARCH in aarch64 x86_64; do
            export ARCH
            rustup target add "${ARCH}-apple-darwin"
            DMG="target/dist/DT-${VERSION}-macos-${ARCH}.dmg"
            cargo run --locked -p xtask -- dmg --release --target "${ARCH}-apple-darwin" --identity - --output "$DMG"
            cargo run --locked -p xtask -- verify-dmg --dmg-path "$DMG"
            (cd target/dist && shasum -a 256 -c "$(basename "$DMG").sha256")
            python3 -c '
          import hashlib, json, os, pathlib, runpy
          m = runpy.run_path("tools/package-release.py")
          out = pathlib.Path("target/dist")
          version = os.environ["VERSION"]
          arch = os.environ["ARCH"]
          commit = os.environ["COMMIT"]
          name = f"DT-{version}-macos-{arch}.dmg"
          digest = hashlib.sha256((out / name).read_bytes()).hexdigest()
          (out / f"{name}.build.json").write_text(json.dumps(dict(product="DT", commit=commit, version=version, os="macos", architecture=arch, sha256=digest), sort_keys=True) + "\n")
          m["write_sbom"](out, name, version, commit, "macos", arch)
          '
          done

      - name: Upload macOS DMG installer artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: grok-muse/target/dist/DT-*-macos-*.dmg*
          if-no-files-found: error
