name: Attach Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v1.0.4)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DT tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          path: grok-muse

      - name: Install Node for React web client tarball
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gather tag artifacts, build tarballs, verify SHA-256, and upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CARGO_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("grok-muse/Cargo.toml","rb"))["workspace"]["package"]["version"])')
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Tag version ($VERSION) does not match Cargo.toml ($CARGO_VERSION)" >&2
            exit 1
          fi

          mkdir -p downloaded upload-dir

          # 1. Prefer completed signed release.yml artifacts for this tag; otherwise use CI tag artifacts
          COMMIT=$(git -C grok-muse rev-parse HEAD)
          REL_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" -w release.yml --branch "$TAG" --commit "$COMMIT" --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          if [[ -n "$REL_RUN_ID" ]]; then
            echo "Downloading artifacts from release.yml run $REL_RUN_ID..."
            gh run download "$REL_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          else
            CI_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" -w ci.yml --branch "$TAG" --commit "$COMMIT" --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')
            if [[ -n "$CI_RUN_ID" ]]; then
              echo "Downloading installer artifacts from ci.yml run $CI_RUN_ID..."
              for art in installer-ubuntu-24.04 installer-ubuntu-24.04-arm installer-windows installer-macos; do
                gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$art" --dir "downloaded/$art"
              done
            fi
          fi

          find downloaded -type f -exec cp -v {} upload-dir/ \;

          # 2. Build React web client bundle tarball + SHA-256
          npm ci --prefix grok-muse/clients/web
          npm run typecheck --prefix grok-muse/clients/web
          npm run build --prefix grok-muse/clients/web
          WEB_TAR="DT-${VERSION}-web-client.tar.gz"
          tar -czf "upload-dir/${WEB_TAR}" -C grok-muse/clients/web dist
          (cd upload-dir && sha256sum "${WEB_TAR}" > "${WEB_TAR}.sha256")

          # 3. Package Linux x86_64 binaries tarball + SHA-256 from the verified CI or signed amd64 .deb
          AMD64_DEB="upload-dir/dt_${VERSION}_amd64.deb"
          BIN_STAGE="bin-stage/DT-${VERSION}-linux-x86_64"
          mkdir -p "${BIN_STAGE}/bin" "${BIN_STAGE}/share/dt"
          dpkg-deb -x "$AMD64_DEB" deb-extract
          cp -a deb-extract/usr/bin/. "${BIN_STAGE}/bin/"
          if [[ -d deb-extract/usr/share/dt/web ]]; then
            cp -a deb-extract/usr/share/dt/web "${BIN_STAGE}/share/dt/"
          fi
          BIN_TAR="DT-${VERSION}-linux-x86_64-binaries.tar.gz"
          tar -czf "upload-dir/${BIN_TAR}" -C bin-stage "DT-${VERSION}-linux-x86_64"
          (cd upload-dir && sha256sum "${BIN_TAR}" > "${BIN_TAR}.sha256")

          installers=(
            "DT-${VERSION}-macos-aarch64.dmg" "DT-${VERSION}-macos-x86_64.dmg"
            "DT-${VERSION}-windows-aarch64-setup.exe" "DT-${VERSION}-windows-x86_64-setup.exe"
            "dt_${VERSION}_amd64.deb" "dt_${VERSION}_arm64.deb"
          )
          for installer in "${installers[@]}"; do
            if [[ ! -s "upload-dir/$installer" || ! -s "upload-dir/$installer.sha256" || ! -s "upload-dir/$installer.build.json" || ! -s "upload-dir/$installer.sbom.json" ]]; then
              echo "Missing installer or release metadata for $installer" >&2
              exit 1
            fi
            jq -e --arg sha "$COMMIT" --arg version "$VERSION" --arg digest "$(cut -d ' ' -f 1 "upload-dir/$installer.sha256")" '.commit == $sha and .version == $version and .sha256 == $digest' "upload-dir/$installer.build.json" >/dev/null
            jq -e --arg sha "$COMMIT" --arg version "$VERSION" --arg name "$installer" '.commit == $sha and .version == $version and .asset == $name and (.packages | length > 0)' "upload-dir/$installer.sbom.json" >/dev/null
          done

          # 4. Verify every SHA-256 sidecar before uploading
          (cd upload-dir && for s in *.sha256; do sha256sum -c "$s"; done)
          ls -lh upload-dir/

          # 5. Ensure release exists and upload all assets
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            NOTES_FILE="grok-muse/docs/releases/${TAG}.md"
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "DT ${TAG}" --notes-file "$NOTES_FILE" --verify-tag --draft --prerelease
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "DT ${TAG}" --generate-notes --verify-tag --draft --prerelease
            fi
          fi
          gh release upload "$TAG" upload-dir/* --repo "$GITHUB_REPOSITORY" --clobber
