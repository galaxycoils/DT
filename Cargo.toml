[workspace]
resolver = "2"
members = [
    "crates/gm-core",
    "crates/gm-platform",
    "crates/gm-cu-helper",
    "crates/gm-llm",
    "crates/gm-muse",
    "crates/gm-safety",
    "crates/gm-memory",
    "crates/gm-goals",
    "crates/gm-agent",
    "crates/gm-daemon",
    "crates/gm-ui",
    "crates/gm-eval",
    "crates/gm-vlm-candle",
    "crates/gm-openbot",
    "xtask",
]
exclude = ["target"]

[workspace.package]
version = "1.0.10"
edition = "2024"
license = "MIT"
authors = ["DT Contributors"]
description = "DT Hybrid Agent: fast computer-use + proactive personal agent"

[workspace.dependencies]
# Internal crates
gm-core = { path = "crates/gm-core" }
gm-platform = { path = "crates/gm-platform" }
gm-safety = { path = "crates/gm-safety" }
gm-memory = { path = "crates/gm-memory" }
gm-llm = { path = "crates/gm-llm" }
gm-muse = { path = "crates/gm-muse" }
gm-goals = { path = "crates/gm-goals" }
gm-agent = { path = "crates/gm-agent" }
gm-vlm-candle = { path = "crates/gm-vlm-candle" }
gm-openbot = { path = "crates/gm-openbot" }
gm-daemon = { path = "crates/gm-daemon" }
gm-cu-helper = { path = "crates/gm-cu-helper" }

# Darius crates share one reviewed upstream revision.
darius-core = { git = "https://github.com/galaxycoils/darius.git", rev = "f47a4ce980abecb751c9f5c79e1c424a20100433" }
darius-safety = { git = "https://github.com/galaxycoils/darius.git", rev = "f47a4ce980abecb751c9f5c79e1c424a20100433" }
darius-memory = { git = "https://github.com/galaxycoils/darius.git", rev = "f47a4ce980abecb751c9f5c79e1c424a20100433" }
darius-daemon = { git = "https://github.com/galaxycoils/darius.git", rev = "f47a4ce980abecb751c9f5c79e1c424a20100433" }
darius-tools = { git = "https://github.com/galaxycoils/darius.git", rev = "f47a4ce980abecb751c9f5c79e1c424a20100433" }

# Shared external dependencies
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
include_dir = "0.7"
tempfile = "3"
regex = "1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 16

# Keep local/CI artifacts bounded; release builds retain their optimized profile above.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
