x-dt-build: &dt-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

services:
  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    restart: unless-stopped
    environment:
      POSTGRES_DB: dt_hosted
      POSTGRES_USER: dt
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - dt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dt -d dt_hosted"]
      interval: 10s
      timeout: 5s
      retries: 5

  dt-server:
    build:
      <<: *dt-build
      target: dt-server
    # Share only the proxy's network namespace so DT can keep its loopback bind.
    network_mode: service:tls-proxy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      RUST_LOG: info
      GROK_MUSE_COMPANION_TOKEN: ${DT_COMPANION_TOKEN:-}
      DT_HOSTED_ENABLED: "1"
      DT_HOSTED_REQUIRED: "1"
      DT_HOSTED_MASTER_KEY_FILE: /run/secrets/dt_hosted_master_key
      DT_DATABASE_URL: ${DT_DATABASE_URL:-}
    secrets:
      - dt_hosted_master_key
    volumes:
      - dt_workers_data:/var/lib/dt
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"

  tls-proxy:
    build:
      <<: *dt-build
      target: tls-proxy
    restart: unless-stopped
    environment:
      DT_DOMAIN: ${DT_DOMAIN:-localhost}
    ports:
      - "443:443"
    volumes:
      - dt_caddy_data:/data

secrets:
  pg_password:
    file: ${DT_POSTGRES_PASSWORD_FILE:-./postgres-password}
  dt_hosted_master_key:
    file: ${DT_HOSTED_MASTER_KEY_FILE:-./hosted-master-key}

volumes:
  dt_pg_data:
  dt_workers_data:
  dt_caddy_data:
